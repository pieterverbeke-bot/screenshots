name: Website Screenshots

on:
  # Triggeren via cron-job.org of handmatig (primair)
  workflow_dispatch:

  # Fallback schedule - GitHub Actions cron is onbetrouwbaar (delays tot ~3u)
  # De primaire trigger is via cron-job.org (zie README)
  schedule:
    - cron: '0 * * * *'

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx puppeteer browsers install chrome

      - name: Take screenshots
        run: node src/take-screenshots.js

      - name: Upload to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: node src/upload-to-r2.js

      - name: Upload screenshots as artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}-${{ github.run_attempt }}
          path: screenshots/
          retention-days: 90
