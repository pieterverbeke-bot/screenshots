name: Website Screenshots

on:
  # Handmatig triggeren
  workflow_dispatch:

  # Schedule - elk uur
  schedule:
    - cron: '0 * * * *'

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx puppeteer browsers install chrome

      - name: Take screenshots
        run: node src/take-screenshots.js

      - name: Upload to Google Drive
        if: ${{ secrets.GOOGLE_SERVICE_ACCOUNT != '' }}
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: node src/upload-to-drive.js

      - name: Upload screenshots as artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}-${{ github.run_attempt }}
          path: screenshots/
          retention-days: 90
