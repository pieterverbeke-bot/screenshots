name: Website Screenshots

on:
  # Triggeren via cron-job.org
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload naar R2 + viewer bijwerken (uit = alleen artifacts, voor tests)'
        type: boolean
        default: true
      sites:
        description: 'Alleen deze sites screenshotten (komma-gescheiden namen); leeg = normale planning'
        type: string
        default: ''

# Productie-runs (upload=true) blijven serieel via één groep om R2-races te vermijden;
# test-runs (upload=false) krijgen een eigen groep zodat ze niet achter productie wachten.
concurrency:
  group: screenshots-${{ inputs.upload && 'prod' || 'test' }}
  cancel-in-progress: false

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx puppeteer browsers install chrome

      # xvfb laat Chrome headed draaien: dat verwijdert de headless-fingerprint waarop
      # Cloudflare/Akamai blokkeren (Nieuwsblad/GvA "you have been blocked", VRT-blocks,
      # geblokkeerde CSS/afbeeldingen). take-screenshots.js detecteert DISPLAY automatisch.
      - name: Take screenshots
        env:
          # Optionele site-filter voor handmatige tests (leeg bij cron → normale planning)
          SITES_FILTER: ${{ inputs.sites }}
        run: xvfb-run -a -s "-screen 0 1920x1080x24" node src/take-screenshots.js

      - name: Upload to Cloudflare R2
        if: ${{ inputs.upload }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: node src/upload-to-r2.js

      # Cleanup en index generation parallel: onafhankelijke R2 operaties
      - name: Cleanup old screenshots + Update viewer page
        if: ${{ inputs.upload }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: node src/cleanup-r2.js & node src/generate-index.js & wait

      - name: Upload screenshots as artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}-${{ github.run_attempt }}
          path: screenshots/
          retention-days: 90
