name: Miniaturen bijwerken

# Eenmalige (of herhaalbare) inhaalslag: maakt miniaturen voor screenshots die
# al in R2 staan van vóór de miniatuur-generatie. Nieuwe screenshots krijgen hun
# miniatuur automatisch tijdens de gewone screenshot-run.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Aantal dagen geschiedenis verwerken (0 = alles)'
        type: string
        default: '30'
      limit:
        description: 'Maximum aantal miniaturen per run (0 = geen limiet)'
        type: string
        default: '0'
      dry_run:
        description: 'Alleen tellen, niets schrijven'
        type: boolean
        default: false

concurrency:
  group: thumbnails
  cancel-in-progress: false

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate missing thumbnails
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          node src/generate-thumbs-r2.js \
            --days "${{ inputs.days }}" \
            --limit "${{ inputs.limit }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Update viewer page
        if: ${{ !inputs.dry_run }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: node src/generate-index.js
