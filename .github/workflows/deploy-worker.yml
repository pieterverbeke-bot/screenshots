name: Worker publiceren

# De Cloudflare Worker (proxy voor R2 + Google-login) hoort bij deze repo, niet
# bij het dashboard: elke wijziging in worker/ gaat hier automatisch naar
# Cloudflare. De secrets in Cloudflare (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# AUTH_SECRET) blijven bij een deploy gewoon staan.
#
# Vereiste GitHub-secrets: CLOUDFLARE_API_TOKEN en CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    # De standaardbranch — hernoem je die, pas dit dan mee aan
    branches:
      - claude/website-screenshot-monitor-554Cn
      - main
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Zelfde commando als lokaal (npm run deploy-worker), zodat handmatig en
      # automatisch deployen niet uit elkaar kunnen lopen.
      - name: Deploy naar Cloudflare
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
