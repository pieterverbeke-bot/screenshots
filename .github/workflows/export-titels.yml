name: Titels exporteren

# Zet de titelbestanden (welke artikels er op elke homepage stonden, zie
# src/titels.js) om naar CSV, één bestand per dag. Het resultaat staat onderaan
# de run bij "Artifacts" als titels-export.zip. Leest enkel uit R2, schrijft niets.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Aantal dagen terug, vandaag inbegrepen'
        type: string
        default: '7'
      sites:
        description: 'Alleen deze sites (komma-gescheiden namen); leeg = alle'
        type: string
        default: ''

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Enkel de S3-client is nodig; geen browser downloaden
      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci

      - name: Export titels
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          DAYS: ${{ inputs.days }}
          SITES: ${{ inputs.sites }}
        run: node src/export-titels.js --days "$DAYS" --sites "$SITES" --out export

      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: titels-export
          path: export/
          if-no-files-found: warn
          retention-days: 7
